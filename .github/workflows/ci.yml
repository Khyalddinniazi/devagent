name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint · types · tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the red-team tests against sandbox-exec, Linux runs them against the Docker sandbox.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv venv -p 3.12 .venv && uv pip install -p .venv -e ".[dev]"
      - name: Build the Docker test-sandbox image (Linux)
        if: runner.os == 'Linux'
        run: make docker-image
      - name: make check
        run: make check

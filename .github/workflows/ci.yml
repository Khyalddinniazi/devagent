name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: lint · types · tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the real sandbox-exec and red-team tests; on Linux those are skipped.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install
        run: uv venv -p 3.12 .venv && uv pip install -p .venv -e ".[dev]"
      - name: make check
        run: make check
